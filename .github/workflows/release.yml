name: release

on:
  push:
    tags:
      - "v2.*"
      - "v3.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            args: --bundles deb,appimage
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux WebKitGTK
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev \
            libfuse2

      - uses: dtolnay/rust-toolchain@stable

      - name: Unix cargo target dir
        run: echo "CARGO_TARGET_DIR=${{ github.workspace }}/src-tauri/target" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install frontend
        run: npm ci

      - name: Build .deb and AppImage
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          releaseName: epg.monster studio ${{ github.ref_type == 'tag' && github.ref_name || github.sha }}
          releaseBody: |
            **epg.monster studio** ${{ github.ref_name }} (Tauri v2).

            Install: `studio.ps1` / `studio.sh` (INSTALL.md). No Windows NSIS, no signed macOS dmg.
            Linux: `.deb`, AppImage, or `./studio.sh`.
            Data lives in `{launch folder}/data`.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

  windows-portable:
    if: github.ref_type == 'tag'
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install frontend
        run: npm ci
      - name: Build desktop UI
        run: npm run build
      - name: Build desktop exe
        run: cargo build --release --features custom-protocol --manifest-path src-tauri/Cargo.toml
      - name: Build web UI
        run: |
          $env:STUDIO_WEB = "1"
          npm run build
      - name: Build studio-server
        run: cargo build -p studio-server --release --manifest-path src-tauri/Cargo.toml
      - name: Pack web dist
        run: Compress-Archive -Path dist\* -DestinationPath studio-web-dist.zip
      - name: Upload portable assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/release/epg-monster-studio.exe
            src-tauri/target/release/studio-server.exe
            studio-web-dist.zip
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
