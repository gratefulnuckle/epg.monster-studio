name: release

on:
  push:
    tags:
      - "v2.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            args: --bundles deb,appimage
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux WebKitGTK
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev \
            libfuse2

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install frontend
        run: npm ci

      - name: Build .deb and AppImage
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          releaseName: epg.monster studio ${{ github.ref_type == 'tag' && github.ref_name || github.sha }}
          releaseBody: |
            **epg.monster studio** ${{ github.ref_name }} (Tauri v2).

            Windows/macOS testers: `studio.ps1` / `studio.sh` (dev). Linux: `.deb`, AppImage, or `./studio.sh`.
            NSIS, Authenticode, and signed `.dmg` are v3.
            Data lives in `{launch folder}/data` (the folder that contains the AppImage), not OS AppData.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
