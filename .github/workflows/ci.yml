name: ci

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  studio-ui:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: studio.sh two-pane layout
        run: bash scripts/test-studio-ui.sh

  studio-core:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Unix cargo target dir
        if: runner.os != 'Windows'
        run: echo "CARGO_TARGET_DIR=${{ github.workspace }}/src-tauri/target" >> "$GITHUB_ENV"
      - name: Linux deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev
      - name: Test studio-core
        run: cargo test -p studio-core
