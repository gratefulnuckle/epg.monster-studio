[package]
name = "studio-core"
version = "1.0.0-beta"
edition = "2021"
license = "GPL-3.0-or-later"
description = "Domain, parser, and SQLite store for epg.monster studio"

[dependencies]
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_repr = "0.1"
regex = "1"
uuid = { version = "1", features = ["v4"] }
thiserror = "2"
dirs = "6"

[dev-dependencies]
tempfile = "3"
