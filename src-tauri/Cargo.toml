[workspace]
members = [".", "crates/studio-core", "crates/studio-tuner"]
resolver = "2"

[package]
name = "epg-monster-studio"
version = "2.0.0"
description = "epg.monster studio (tauri)"
authors = ["epg.monster"]
license = "GPL-3.0-or-later"
edition = "2021"
rust-version = "1.77"

[lib]
name = "epg_monster_studio_lib"
# cdylib hits "export ordinal too large" on Windows GNU. Desktop uses rlib + bin.
crate-type = ["staticlib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
studio-core = { path = "crates/studio-core" }
studio-tuner = { path = "crates/studio-tuner" }
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
