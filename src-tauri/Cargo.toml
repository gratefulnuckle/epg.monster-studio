[workspace]
members = [
    ".",
    "crates/studio-core",
    "crates/studio-tuner",
    "crates/studio-server",
    "crates/ghoul-guide",
    "crates/ghoul-play",
    "crates/ghoul-pane",
]
exclude = ["crates/ghoul-gst"]
resolver = "2"

[package]
name = "epg-monster-studio"
version = "3.0.0"
description = "epg.monster studio"
authors = ["epg.monster"]
license = "GPL-3.0-or-later"
edition = "2021"
rust-version = "1.77"

[lib]
name = "epg_monster_studio_lib"
# cdylib hits "export ordinal too large" on Windows GNU. Desktop uses rlib + bin.
crate-type = ["staticlib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
studio-core = { path = "crates/studio-core" }
studio-tuner = { path = "crates/studio-tuner" }
ghoul-guide = { path = "crates/ghoul-guide" }
ghoul-play = { path = "crates/ghoul-play" }
ghoul-pane = { path = "crates/ghoul-pane" }
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-dialog = "2.7"
tauri-plugin-opener = "2.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# custom-protocol = load UI from dist/ inside the .exe (no Vite, no 127.0.0.1).
# `tauri dev` passes --no-default-features so it can still use a local server.
[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.dev]
# Keep debug info off for crates.io deps (the 300 MB GNU exe). Workspace
# crates keep line tables so tauri-dev panics still have a useful file:line.
debug = 0

[profile.dev.package."epg-monster-studio"]
debug = "line-tables-only"
[profile.dev.package.studio-core]
debug = "line-tables-only"
[profile.dev.package.studio-tuner]
debug = "line-tables-only"
[profile.dev.package.ghoul-guide]
debug = "line-tables-only"
[profile.dev.package.ghoul-play]
debug = "line-tables-only"
[profile.dev.package.ghoul-pane]
debug = "line-tables-only"
